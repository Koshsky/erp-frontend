# CI для erp-frontend.
# Проверка «CI / Branch policy» — required status check для main/staging/dev
# (см. scripts/branch-protection/ в erp-infra).
name: CI

on:
  pull_request:
  push:
    branches: [main, staging, dev]

permissions:
  contents: read

jobs:
  # Веточная политика: main принимает PR только из staging,
  # staging — только из dev, dev — только из feature/* и hotfix/*.
  policy:
    name: Branch policy
    runs-on: ubuntu-latest
    steps:
      - name: Verify PR source branch
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        # на push (без PR) base_ref/head_ref пустые — попадаем в `*` и проходим
        run: |
          case "$BASE" in
            main)
              [ "$HEAD" = "staging" ] && echo "OK: main <- staging" \
                || { echo "main принимает PR только из staging (получено: $HEAD)"; exit 1; }
              ;;
            staging)
              [ "$HEAD" = "dev" ] && echo "OK: staging <- dev" \
                || { echo "staging принимает PR только из dev (получено: $HEAD)"; exit 1; }
              ;;
            dev)
              case "$HEAD" in
                feature/*|hotfix/*) echo "OK: dev <- $HEAD" ;;
                *) echo "dev принимает PR только из feature/* или hotfix/* (получено: $HEAD)"; exit 1 ;;
              esac
              ;;
            *)
              exit 0
              ;;
          esac

  check:
    name: Typecheck & build
    runs-on: ubuntu-latest
    env:
      # не качать браузеры Playwright при npm ci — e2e пока не в CI
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build