# CI for erp-frontend. Main is the only permanent branch.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  policy:
    name: Branch policy
    runs-on: ubuntu-latest
    steps:
      - name: Verify PR source branch
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          [ -n "$BASE" ] || exit 0
          case "$HEAD" in
            main|dev|staging)
              echo "FAIL: use a short-lived topic branch targeting main"
              exit 1
              ;;
            *)
              echo "PASS: topic branch targets main"
              ;;
          esac

  check:
    name: Lint, typecheck & build
    runs-on: ubuntu-latest
    env:
      # Do not download Playwright browsers during npm ci — e2e tests are not
      # part of CI yet.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm run build
