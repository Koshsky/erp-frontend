server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Security-заголовки (AD-12). Реальная защита на краевом nginx (nginx/nginx.conf);
    # здесь — для standalone-контейнера (docker-compose frontend на :3000). В
    # location с собственным add_header набор повторяется явно (nginx не дополняет,
    # а заменяет унаследованные add_header).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://service.mvsservice.ru; connect-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Хэшированные ассеты сборки (JS/CSS/шрифты) иммутабельны: URL меняется
    # при изменении содержимого, поэтому их можно кэшировать в браузере
    # навсегда — повторные визиты не скачивают тяжёлые чанки (pdf.js, pdf-lib).
    location /assets/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html без кэша: браузер всегда получает свежий HTML со ссылками на
    # актуальные хэшированные ассеты (старый кэш при новой сборке не цепляется).
    location = /index.html {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://service.mvsservice.ru; connect-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Cache-Control "no-cache";
    }

    # Service Worker без кэша: браузер должен проверять sw.js при каждой навигации,
    # иначе офлайн-кэш навсегда застрянет на старой версии приложения.
    location = /sw.js {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-cache";
    }

    # Манифест PWA тоже без кэша (меняется вместе с релизами).
    location = /manifest.webmanifest {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-cache";
    }

    # Список ассетов для precache Service Worker: меняется на каждой сборке,
    # браузер должен всегда получать актуальный (SW читает его при install/activate).
    location = /precache-manifest.json {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}