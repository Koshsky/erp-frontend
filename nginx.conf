server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Хэшированные ассеты сборки (JS/CSS/шрифты) иммутабельны: URL меняется
    # при изменении содержимого, поэтому их можно кэшировать в браузере
    # навсегда — повторные визиты не скачивают тяжёлые чанки (pdf.js, pdf-lib).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html без кэша: браузер всегда получает свежий HTML со ссылками на
    # актуальные хэшированные ассеты (старый кэш при новой сборке не цепляется).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Service Worker без кэша: браузер должен проверять sw.js при каждой навигации,
    # иначе офлайн-кэш навсегда застрянет на старой версии приложения.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # Манифест PWA тоже без кэша (меняется вместе с релизами).
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
